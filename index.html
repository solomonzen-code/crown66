<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皇冠国际 · 尊享娱乐 · 信誉至上</title>
<meta name="description" content="皇冠国际 — 尊享娱乐 · 信誉至上">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&amp;family=Noto+Serif+TC:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg-start: #0a0a0f;
    --bg-end: #1a0a2e;
    --gold-1: #D4AF37;
    --gold-2: #F0C75E;
    --gold-3: #B8941F;
    --gold-glow: rgba(212, 175, 55, 0.35);
    --ink: #ece6d6;
    --ink-dim: rgba(236, 230, 214, 0.65);
    --hairline: rgba(212, 175, 55, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    font-family: 'Noto Serif TC', 'Cinzel', Georgia, serif;
    color: var(--ink);
    background: #08080c;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  /* Centered radial glow behind everything */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(ellipse at 50% 30%, rgba(18, 12, 30, 0.6) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Decorative ambient glows */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }
  .glow-1 {
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(212,175,55,0.28), transparent 70%);
    top: -120px; left: -120px;
  }
  .glow-2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(95,40,140,0.45), transparent 70%);
    bottom: -180px; right: -120px;
  }

  /* Layout */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: clamp(24px, 5vw, 56px) clamp(20px, 5vw, 64px);
  }

  /* Top hairline frame */
  .frame-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    opacity: 0;
    animation: fadeDown 1s ease-out 0.2s forwards;
  }
  .frame-mark {
    font-family: 'Cinzel', 'Noto Serif TC', serif;
    font-size: 11px;
    letter-spacing: 0.5em;
    color: var(--gold-2);
    text-transform: uppercase;
  }
  .frame-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--hairline), transparent);
    max-width: 420px;
  }

  /* Hero */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(32px, 6vh, 64px) 0;
    position: relative;
  }

  .logo-img {
    width: clamp(180px, 30vw, 280px);
    height: auto;
    display: block;
    margin: clamp(24px, 4.5vh, 48px) auto 0;
    opacity: 0;
    animation: crownIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
    filter: drop-shadow(0 0 28px var(--gold-glow));
  }

  .eyebrow {
    font-family: 'Cinzel', 'Noto Serif TC', serif;
    font-size: clamp(11px, 1.4vw, 13px);
    letter-spacing: 0.55em;
    color: var(--gold-2);
    margin-bottom: clamp(18px, 2.5vh, 24px);
    display: inline-flex;
    align-items: center;
    gap: 18px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1s ease-out 0.7s forwards;
  }
  .eyebrow::before, .eyebrow::after {
    content: '';
    width: 36px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-1), transparent);
  }

  .brand {
    font-family: 'Cinzel', 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: clamp(48px, 9vw, 124px);
    line-height: 1.02;
    letter-spacing: clamp(2px, 0.6vw, 8px);
    background: linear-gradient(180deg, #F8E5A8 0%, #F0C75E 35%, #D4AF37 60%, #8C6F1A 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 50px rgba(212, 175, 55, 0.18);
    margin-bottom: clamp(16px, 2vh, 22px);
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.9s forwards;
    position: relative;
  }

  .brand-underline {
    width: clamp(120px, 18vw, 200px);
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-1), transparent);
    margin: 0 auto clamp(18px, 2.5vh, 24px);
    position: relative;
    opacity: 0;
    animation: fadeIn 1s ease-out 1.3s forwards;
  }
  .brand-underline::before {
    content: '';
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 7px;
    height: 7px;
    background: var(--gold-1);
    box-shadow: 0 0 12px var(--gold-glow);
  }

  .tagline {
    font-family: 'Noto Serif TC', serif;
    font-weight: 300;
    font-size: clamp(14px, 1.6vw, 18px);
    color: var(--ink-dim);
    letter-spacing: 0.18em;
    margin-bottom: clamp(28px, 4vh, 40px);
    opacity: 0;
    animation: fadeUp 1s ease-out 1.5s forwards;
  }

  /* Button group */
  .cta-group {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
  }

  /* Primary CTA */
  .cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    padding: clamp(15px, 1.9vh, 19px) clamp(28px, 5vw, 56px);
    font-family: 'Cinzel', 'Noto Serif TC', serif;
    font-size: clamp(14px, 1.5vw, 16px);
    font-weight: 600;
    letter-spacing: 0.32em;
    text-decoration: none;
    color: #1a1208;
    background: linear-gradient(135deg, #F8E5A8 0%, #F0C75E 30%, #D4AF37 70%, #B8941F 100%);
    border: 1px solid rgba(248, 229, 168, 0.5);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    box-shadow:
      0 0 0 1px rgba(212, 175, 55, 0.2),
      0 10px 30px rgba(0, 0, 0, 0.5),
      0 0 40px rgba(212, 175, 55, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.4s ease,
                letter-spacing 0.4s ease;
    opacity: 0;
    animation: fadeUp 1s ease-out forwards;
  }

  .cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      120deg,
      transparent 30%,
      rgba(255, 255, 255, 0.6) 50%,
      transparent 70%
    );
    transform: translateX(-100%);
    transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 1;
  }

  .cta:hover {
    transform: translateY(-2px);
    letter-spacing: 0.38em;
    box-shadow:
      0 0 0 1px rgba(248, 229, 168, 0.5),
      0 15px 40px rgba(0, 0, 0, 0.6),
      0 0 60px rgba(212, 175, 55, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.5),
      inset 0 -1px 0 rgba(0, 0, 0, 0.2);
  }

  .cta:hover::before {
    transform: translateX(100%);
  }

  .cta:active {
    transform: translateY(0);
  }

  .cta-arrow {
    width: 16px;
    height: 16px;
    transition: transform 0.4s ease;
    z-index: 2;
  }

  .cta:hover .cta-arrow {
    transform: translateX(4px);
  }

  .cta-text { z-index: 2; position: relative; }

  /* Secondary buttons */
  .btn-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: inline-block;
    position: relative;
    z-index: 1;
  }

  .cta-secondary {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 11px 24px;
    font-family: 'Cinzel', 'Noto Serif TC', serif;
    font-size: clamp(12px, 1.3vw, 14px);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-decoration: none;
    color: var(--gold-2);
    background: rgba(212, 175, 55, 0.04);
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    transition: color 0.4s ease,
                border-color 0.4s ease,
                transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                letter-spacing 0.4s ease;
    opacity: 0;
    animation: fadeUp 1s ease-out forwards;
  }

  .cta-secondary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #F8E5A8 0%, #F0C75E 30%, #D4AF37 70%, #B8941F 100%);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: -1;
  }

  .cta-secondary > * {
    position: relative;
    z-index: 1;
  }

  .cta-secondary:hover {
    color: #1a1208;
    border-color: rgba(248, 229, 168, 0.85);
    transform: translateY(-1px);
    letter-spacing: 0.26em;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4),
                0 0 25px rgba(212, 175, 55, 0.25);
  }

  .cta-secondary:hover::before {
    transform: scaleX(1);
  }

  .cta-secondary:active {
    transform: translateY(0);
  }

  /* Ornamental side marks */
  .ornaments {
    display: flex;
    gap: 18px;
    margin-top: clamp(28px, 4vh, 40px);
    align-items: center;
    color: var(--gold-1);
    opacity: 0;
    animation: fadeIn 1s ease-out 2.4s forwards;
  }
  .ornaments span {
    font-family: 'Cinzel', 'Noto Serif TC', serif;
    font-size: 10px;
    letter-spacing: 0.45em;
    color: var(--gold-1);
    opacity: 0.7;
  }
  .ornament-dot {
    width: 4px; height: 4px;
    background: var(--gold-1);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--gold-glow);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding-top: clamp(36px, 5vh, 52px);
    background: transparent;
    opacity: 0;
    animation: fadeIn 1s ease-out 2.6s forwards;
  }
  .footer-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .footer-mark {
    font-family: 'Cinzel', 'Noto Serif TC', serif;
    color: var(--gold-2);
    font-size: 11px;
    letter-spacing: 0.5em;
    margin-bottom: 6px;
  }
  .footer-text {
    font-family: 'Noto Serif TC', serif;
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 0.12em;
  }
  .footer-divider {
    color: var(--gold-1);
    margin: 0 10px;
    opacity: 0.6;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes crownIn {
    from { opacity: 0; transform: translateY(-30px) scale(0.8); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Responsive — tablet & below (≤ 768px): button group takes 80% width, capped */
  @media (max-width: 768px) {
    .page { padding: 24px 22px; }
    .frame-line { max-width: 120px; }
    .cta-group { width: 80%; max-width: 360px; }
  }

  /* Responsive — mobile (≤ 480px): button group 90%, tightened typography */
  @media (max-width: 480px) {
    .page { padding: 18px 14px; }
    .frame-line { max-width: 50px; }
    .frame-mark { font-size: 9px; letter-spacing: 0.35em; }
    .eyebrow { font-size: 10px; letter-spacing: 0.4em; gap: 10px; }
    .eyebrow::before, .eyebrow::after { width: 20px; }
    .brand { letter-spacing: 2px; }
    .tagline { font-size: 13px; letter-spacing: 0.1em; padding: 0 6px; }
    .cta-group { width: 90%; max-width: 320px; gap: 10px; }
    .cta { padding: 14px 22px; letter-spacing: 0.24em; }
    .cta:hover { letter-spacing: 0.28em; }
    .cta-secondary { padding: 10px 16px; letter-spacing: 0.18em; gap: 8px; }
    .cta-secondary:hover { letter-spacing: 0.22em; }
    .btn-icon { width: 14px; height: 14px; }
    .footer-text { font-size: 11px; word-break: keep-all; }
    .footer-divider { margin: 0 6px; }
    .ornaments { gap: 12px; }
    .ornaments span { font-size: 9px; letter-spacing: 0.35em; }
  }

  /* Responsive — very small phones (≤ 360px): extra-tight to avoid overflow */
  @media (max-width: 360px) {
    .page { padding: 16px 12px; }
    .brand { font-size: clamp(40px, 13vw, 56px); }
    .frame-mark { font-size: 8px; letter-spacing: 0.3em; }
    .frame-line { max-width: 30px; }
    .cta-secondary { padding: 9px 12px; letter-spacing: 0.14em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="page">
    <header class="frame-top">
      <div class="frame-mark" id="brandMark">皇冠国际</div>
      <div class="frame-line"></div>
      <div class="frame-mark">Est. CROWN</div>
    </header>

    <main class="hero">
      <img class="logo-img" src="logo.png" alt="皇冠国际 Crown International">
      <div class="brand-underline"></div>

      <p class="tagline" id="tagline">尊享娱乐 · 信誉至上</p>

      <div class="cta-group" id="ctaGroup"></div>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-mark" id="footerMark">◆ 皇冠国际 ◆</div>
        <div class="footer-text">
          <span id="lastUpdate">最后更新 2026/05/11</span>
          <span class="footer-divider">·</span>
          <span>© 2016 All rights reserved</span>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const CONFIG = {
      brandName: "皇冠国际",
      tagline: "尊享娱乐 · 信誉至上",
      buttons: [
        { label: "游戏登入", url: "https://download.maymaydd.com/chatbet_v3/game/loginweb.php", primary: true },
        { label: "微信链接", url: "http://zda3.layueshiqio.com/portal3.php?S=HGGJA9", primary: false, icon: "wechat" },
        { label: "安卓 APK 下载", url: "https://download.maymaydd.com/dl_files/hggj_20240707-2.apk", primary: false, icon: "download" },
        { label: "联系客服", url: "https://layueshiqif.com/nd6waq", primary: false },
        { label: "OKX(欧易) APK 下载", url: "https://download.maymaydd.com/dl_files/okx.apk", primary: false, icon: "download" },
        { label: "币安 APK 下载", url: "https://download.maymaydd.com/dl_files/BNAPP64.APK", primary: false, icon: "download" },
      ],
    };
    document.getElementById('brandMark').textContent = CONFIG.brandName;
    document.getElementById('footerMark').textContent = '◆ ' + CONFIG.brandName + ' ◆';
    document.getElementById('tagline').textContent = CONFIG.tagline;
    const now = new Date();
    const dateStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0');
    document.getElementById('lastUpdate').textContent = '最后更新 ' + dateStr;
    document.title = CONFIG.brandName + ' · ' + CONFIG.tagline;

    const group = document.getElementById('ctaGroup');
    const baseDelay = 1.7;
    const stagger = 0.1;

    CONFIG.buttons.forEach((btn, i) => {
      const a = document.createElement('a');
      a.href = btn.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.animationDelay = (baseDelay + i * stagger) + 's';

      if (btn.primary) {
        a.className = 'cta';
        a.innerHTML =
          '<span class="cta-text">' + btn.label + '</span>' +
          '<svg class="cta-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>';
      } else {
        a.className = 'cta-secondary';
        const icons = {
          wechat:
            '<svg class="btn-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
              '<path fill="#07C160" d="M664.25 368.54c10.02 0 19.89.73 29.67 1.8-26.65-122.81-159.36-214.08-310.83-214.08C213.74 156.26 75 270.49 75 415.53c0 83.71 46.17 152.46 123.28 205.78l-30.81 91.73 107.69-53.45c38.56 7.54 69.46 15.29 107.95 15.29 9.66 0 19.23-.44 28.75-1.17-6.02-20.39-9.52-41.73-9.52-63.88 0-133.61 115.01-241.28 261.85-241.28zM498.63 285.87c23.2 0 38.56 15.1 38.56 38.06 0 22.85-15.36 38.13-38.56 38.13-23.11 0-46.26-15.29-46.26-38.13 0-22.96 23.15-38.06 46.26-38.06zM283.02 362.07c-23.11 0-46.4-15.29-46.4-38.13 0-22.96 23.3-38.06 46.4-38.06 23.08 0 38.37 15.1 38.37 38.06 0 22.85-15.29 38.13-38.37 38.13zM945.45 626.61c0-121.99-122.24-221.35-259.49-221.35-145.22 0-259.62 99.36-259.62 221.35 0 122.22 114.4 221.35 259.62 221.35 30.35 0 60.97-7.66 91.4-15.29l83.51 45.83-22.9-76.17c61.42-46.4 107.49-107.93 107.49-176.74zM599.82 588.45c-15.3 0-30.73-15.1-30.73-30.51 0-15.2 15.43-30.5 30.73-30.5 23.3 0 38.56 15.3 38.56 30.5 0 15.41-15.26 30.51-38.56 30.51zM768.17 588.45c-15.2 0-30.55-15.1-30.55-30.51 0-15.2 15.35-30.5 30.55-30.5 23.18 0 38.56 15.3 38.56 30.5 0 15.41-15.38 30.51-38.56 30.51z"/>' +
            '</svg>',
          download:
            '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
              '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="#F8E5A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
              '<polyline points="7 10 12 15 17 10" stroke="#F8E5A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
              '<line x1="12" y1="15" x2="12" y2="3" stroke="#F8E5A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>',
        };
        const iconHtml = btn.icon && icons[btn.icon] ? icons[btn.icon] : '';
        a.innerHTML = iconHtml + '<span>' + btn.label + '</span>';

        if (btn.icon === 'wechat') {
          a.addEventListener('click', e => {
            e.preventDefault();
            navigator.clipboard.writeText(btn.url);
            const span = a.querySelector('span');
            const original = span.textContent;
            span.textContent = '✓ 链接已复制';
            setTimeout(() => { span.textContent = original; }, 2000);
          });
        }
      }

      group.appendChild(a);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c')) e.preventDefault();
    });
  </script>



</body></html>
